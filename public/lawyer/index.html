<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attorney Panel | Batumionline</title>
  <meta name="theme-color" content="#0a1628" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <style>
    body, body * { font-family: 'Assistant', sans-serif; }
    body { background: var(--navy); min-height: 100vh; }
    .lawyer-wrap { max-width: 700px; margin: 0 auto; padding: 1.5rem; }
    .lawyer-header { text-align: center; padding: 2rem 0 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .lawyer-header h1 { font-size: 1.4rem; color: var(--gold-light); margin-top: 0.75rem; }
    .client-card { background: var(--navy-mid); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; transition: border-color 0.2s; }
    .client-card:hover { border-color: rgba(232,188,58,0.3); }
    .client-name { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.35rem; }
    .client-meta { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.85rem; font-size: 0.82rem; color: var(--text-muted); }
    .client-actions { display: flex; flex-direction: column; gap: 0.55rem; }
    .step-btn {
      display: flex; flex-direction: row; align-items: center; justify-content: flex-start;
      width: 100%; gap: 0.8rem;
      padding: 0.9rem 1rem; border-radius: 12px; border: 1.5px solid var(--border);
      background: rgba(255,255,255,0.04); color: var(--text-main);
      font-size: 0.98rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: left;
    }
    .step-btn:hover:not(:disabled) { border-color: rgba(232,188,58,0.45); background: rgba(232,188,58,0.07); }
    .step-btn:disabled { opacity: 0.32; cursor: not-allowed; }
    .step-btn.done { border-color: rgba(46,204,113,0.55); background: rgba(46,204,113,0.12); color: #2ecc71; }
    .step-btn .ico { font-size: 1.35rem; flex-shrink: 0; width: 1.8rem; text-align: center; }
    .step-btn.done .ico { color: #2ecc71; }
    .step-btn.reject:hover:not(:disabled) { border-color: rgba(231,76,60,0.55); background: rgba(231,76,60,0.1); color: #e74c3c; }
    .step-btn.is-rejected { border-color: rgba(231,76,60,0.55); background: rgba(231,76,60,0.12); color: #e74c3c; }
    .step-btn .lbl { display: flex; flex-direction: column; gap: 0.12rem; line-height: 1.25; }
    .step-btn .lbl-sub { font-size: 0.7rem; font-weight: 500; opacity: 0.9; }
    .step-btn .by { opacity: 0.85; }
    .step-btn label { cursor: pointer; margin: 0; display: flex; flex-direction: row; align-items: center; gap: 0.8rem; width: 100%; }
    .step-btn label input[type="file"] { display: none; }
    .completed-msg { text-align: center; padding: 0.75rem; color: #2ecc71; font-weight: 700; font-size: 0.95rem; margin-top: 0.5rem; }
    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    .empty-state div { font-size: 3rem; margin-bottom: 1rem; }
    .stage { border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; margin-top: 0.85rem; }
    .stage.done { border-color: rgba(46,204,113,0.4); background: rgba(46,204,113,0.05); }
    .stage-head { display: flex; align-items: flex-start; gap: 0.7rem; margin-bottom: 0.75rem; }
    .stage-num { flex-shrink: 0; width: 1.9rem; height: 1.9rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem; background: rgba(232,188,58,0.15); color: var(--gold-light); border: 1.5px solid rgba(232,188,58,0.4); }
    .stage.done .stage-num { background: rgba(46,204,113,0.18); color: #2ecc71; border-color: rgba(46,204,113,0.5); }
    .stage-title { font-size: 1rem; font-weight: 800; color: var(--text-main); line-height: 1.3; }
    .stage-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.15rem; line-height: 1.45; }
    .stage .client-actions { gap: 0.5rem; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div style="max-width:360px;width:100%;padding:1.5rem;">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="margin:0 auto 0.75rem;width:48px;height:48px;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#2a1f05;font-weight:800;font-size:1.5rem;display:flex;align-items:center;justify-content:center;border-radius:12px;">B</div>
      <h2 style="color:var(--gold-light);font-size:1.2rem;">Attorney Panel</h2>
      <p style="color:var(--text-muted);font-size:0.85rem;">Batumionline</p>
    </div>
    <div class="card">
      <div class="form-group">
        <input type="password" id="login-pass" class="form-control" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <div id="login-error" class="alert alert-error" style="display:none;"></div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">Login</button>
    </div>
  </div>
</div>

<!-- PANEL -->
<div id="lawyer-panel" style="display:none;">
  <div class="lawyer-wrap">
    <div class="lawyer-header">
      <div style="margin:0 auto;width:44px;height:44px;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#2a1f05;font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center;border-radius:11px;">B</div>
      <h1>⚖️ Attorney Panel</h1>
      <p style="color:var(--text-muted);font-size:0.85rem;">Client cases — passport review &amp; account opening</p>
    </div>

    <div id="clients-list"></div>

    <div style="text-align:center;margin-top:2rem;">
      <button class="btn btn-ghost" style="font-size:0.8rem;" onclick="loadClients()">🔄 Refresh</button>
      <button class="btn btn-ghost" style="font-size:0.8rem;margin-left:0.5rem;" onclick="logout()">🚪 Logout</button>
    </div>
  </div>
</div>

<script>
var lawyerToken = '';
var STEP_LABELS = {
  2: 'Passport review', 3: 'Passport review', 4: 'Payment', 5: 'Notary',
  6: 'In progress', 7: 'In progress', 8: 'In progress', 9: 'Awaiting shipment',
  10: 'Docs in transit', 11: 'Docs arrived', 12: 'Account opened', 13: 'Completed'
};

(function() {
  var saved = sessionStorage.getItem('lawyer_token');
  if (saved) { lawyerToken = saved; showPanel(); }
})();

async function doLogin() {
  var pass = document.getElementById('login-pass').value;
  if (!pass) return;
  try {
    var res = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    var data = await res.json();
    if (data.success) {
      lawyerToken = data.token; sessionStorage.setItem('lawyer_token', lawyerToken); showPanel();
    } else {
      var res2 = await fetch('/api/lawyer/clients', { headers: { 'x-lawyer-token': pass } });
      if (res2.ok) {
        lawyerToken = pass; sessionStorage.setItem('lawyer_token', lawyerToken); showPanel();
      } else {
        document.getElementById('login-error').textContent = 'Wrong password';
        document.getElementById('login-error').style.display = 'flex';
      }
    }
  } catch (e) {
    document.getElementById('login-error').textContent = 'Connection error';
    document.getElementById('login-error').style.display = 'flex';
  }
}

function showPanel() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('lawyer-panel').style.display = 'block';
  loadClients();
}
function logout() { sessionStorage.clear(); window.location.reload(); }
function authHeaders() { return { 'Content-Type': 'application/json', 'x-lawyer-token': lawyerToken }; }

async function loadClients() {
  try {
    var res = await fetch('/api/lawyer/clients', { headers: { 'x-lawyer-token': lawyerToken } });
    var data = await res.json();
    renderClients(data.clients || []);
  } catch (e) {
    document.getElementById('clients-list').innerHTML = '<div class="alert alert-error">Connection error</div>';
  }
}

function fmtTime(iso) {
  if (!iso) return '';
  var d = new Date(iso); if (isNaN(d.getTime())) return '';
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function subLine(by, at) {
  var parts = []; if (by) parts.push(by);
  var t = fmtTime(at); if (t) parts.push(t);
  return parts.length ? '<span class="lbl-sub">✓ ' + parts.join(' · ') + '</span>' : '';
}

function renderClients(clients) {
  var container = document.getElementById('clients-list');
  if (clients.length === 0) {
    container.innerHTML = '<div class="empty-state"><div>✅</div><p>No clients at this stage yet</p></div>';
    return;
  }
  container.innerHTML = clients.map(function(c) {
    var enName = ((c.passport_name_en || '') + ' ' + (c.passport_surname_en || '')).trim() || (c.first_name + ' ' + c.last_name);
    var s1 = c.passport_status === 'approved';
    var s2 = c.has_poa;
    var sDl = c.docs_downloaded ? true : false;
    var s3 = c.docs_received ? true : false;
    var s4 = c.account_opened ? true : false;
    var allDone = s1 && s2 && s3 && s4;

    // Buttons reused inside the 4 stages below
    var btnViewPassport = '<button class="step-btn" onclick="doViewPassport(' + c.id + ')">'
      + '<span class="ico">🔍</span><span class="lbl"><span>View Passport</span></span></button>';
    var btnApprove = '<button class="step-btn' + (s1 ? ' done' : '') + '"' + (s1 ? ' disabled' : '') + ' onclick="doApprove(' + c.id + ')">'
      + '<span class="ico">' + (s1 ? '✓' : '✅') + '</span><span class="lbl"><span>' + (s1 ? 'Passport Approved' : 'Approve Passport') + '</span>' + (s1 ? subLine(c.passport_approved_by, c.passport_approved_at) : '') + '</span></button>';
    var rejected = c.passport_status === 'rejected';
    var btnReject = '<button class="step-btn reject' + (rejected ? ' is-rejected' : '') + '"' + (s1 ? ' disabled' : '') + ' onclick="doReject(' + c.id + ')">'
      + '<span class="ico">' + (rejected ? '⛔' : '❌') + '</span><span class="lbl"><span>' + (rejected ? 'Passport Rejected' : 'Reject Passport') + '</span></span></button>';
    var btnUploadPOA = '<label class="step-btn' + (s2 ? ' done' : '') + '">'
      + '<span class="ico">' + (s2 ? '✓' : '📄') + '</span><span class="lbl"><span>' + (s2 ? 'POA Uploaded' : 'Upload POA') + '</span>' + (s2 ? subLine(c.poa_uploaded_by, c.poa_uploaded_at) : '') + '</span>'
      + (s2 ? '' : '<input type="file" accept=".pdf" onchange="doUploadPOA(' + c.id + ', this)" />') + '</label>';
    var btnDownload = '<button class="step-btn' + (sDl ? ' done' : '') + '"' + (c.current_step >= 9 ? '' : ' disabled') + ' onclick="downloadDocs(' + c.id + ')">'
      + '<span class="ico">' + (sDl ? '✓' : '📥') + '</span><span class="lbl"><span>Download Scans</span>' + (sDl ? subLine(c.docs_downloaded_by, c.docs_downloaded_at) : '') + '</span></button>';
    var btnReceived = '<button class="step-btn' + (s3 ? ' done' : '') + '"' + ((s3 || c.current_step < 10) ? ' disabled' : '') + ' onclick="doDocsReceived(' + c.id + ')">'
      + '<span class="ico">' + (s3 ? '✓' : '📬') + '</span><span class="lbl"><span>' + (s3 ? 'Originals Received' : 'Mail Arrived') + '</span>' + (s3 ? subLine(c.docs_received_by, c.docs_received_at) : '') + '</span></button>';
    var btnAccount = '<button class="step-btn' + (s4 ? ' done' : '') + '"' + (!s3 || s4 ? ' disabled' : '') + ' onclick="doAccountOpened(' + c.id + ')">'
      + '<span class="ico">' + (s4 ? '✓' : '🏦') + '</span><span class="lbl"><span>Account Opened</span>' + (s4 ? subLine(c.account_opened_by, c.account_opened_at) : '') + '</span></button>';

    function stage(num, done, title, desc, buttons) {
      return '<div class="stage' + (done ? ' done' : '') + '">'
        + '<div class="stage-head"><span class="stage-num">' + (done ? '✓' : num) + '</span>'
        + '<div><div class="stage-title">' + title + '</div><div class="stage-desc">' + desc + '</div></div></div>'
        + '<div class="client-actions">' + buttons + '</div></div>';
    }

    return '<div class="client-card">'
      + '<div class="client-name">' + enName + '</div>'
      + '<div class="client-meta">'
      +   '<span>' + c.phone + '</span>'
      +   '<span>· ' + (STEP_LABELS[c.current_step] || ('Step ' + c.current_step)) + '</span>'
      +   (c.tracking_number ? '<span>📦 ' + (c.shipping_company || '') + ' ' + c.tracking_number + '</span>' : '')
      + '</div>'
      + stage(1, s1, 'Passport &amp; Power of Attorney', 'View the client’s passport, approve or reject it, then upload the signed notarial Power of Attorney bearing the client’s name.', btnViewPassport + btnApprove + btnReject + btnUploadPOA)
      + stage(2, sDl, 'Download Documents', 'Download the documents the client sent. These are copies only — the originals will arrive by mail.', btnDownload)
      + stage(3, s3, 'Originals Received', 'Mark here once the client’s mail has reached you and the original documents are physically in your hands.', btnReceived)
      + stage(4, s4, 'Account Opened', 'The bank account was opened successfully. The client will receive an SMS from the bank with login details.', btnAccount)
      + (allDone ? '<div class="completed-msg">✅ Case completed</div>' : '')
      + '</div>';
  }).join('');
}

async function doViewPassport(clientId) {
  try {
    var res = await fetch('/api/lawyer/client/' + clientId + '/docs', { headers: { 'x-lawyer-token': lawyerToken } });
    var data = await res.json();
    var passport = (data.docs || []).find(function(d) { return d.doc_type === 'passport' || d.doc_type === 'passport_drive'; });
    if (passport && passport.drive_url) window.open(passport.drive_url, '_blank');
    else alert('Passport file not found');
  } catch (e) { alert('Error'); }
}

async function doApprove(clientId) {
  if (!confirm('Approve this passport? The client will move to the payment step and be notified.')) return;
  try {
    var res = await fetch('/api/lawyer/passport/approve', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ client_id: clientId }) });
    var data = await res.json();
    alert(data.message || 'Approved');
    loadClients();
  } catch (e) { alert('Error'); }
}

async function doReject(clientId) {
  if (!confirm('Reject this passport? The client will be notified and may try again later.')) return;
  try {
    var res = await fetch('/api/lawyer/passport/reject', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ client_id: clientId }) });
    var data = await res.json();
    alert(data.message || 'Rejected');
    loadClients();
  } catch (e) { alert('Error'); }
}

async function doUploadPOA(clientId, input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  if (file.type !== 'application/pdf') { alert('PDF files only'); return; }
  var formData = new FormData();
  formData.append('poa_file', file);
  try {
    var res = await fetch('/api/lawyer/upload-poa/' + clientId, { method: 'POST', headers: { 'x-lawyer-token': lawyerToken }, body: formData });
    var data = await res.json();
    if (data.success) {
      await fetch('/api/lawyer/mark-step', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ client_id: clientId, step: 2 }) });
      alert('Power of Attorney uploaded successfully!');
      loadClients();
    } else alert(data.error || 'Error');
  } catch (e) { alert('Connection error'); }
  input.value = '';
}

function downloadDocs(clientId) {
  window.open('/api/lawyer/client/' + clientId + '/download-docs?token=' + lawyerToken, '_blank');
  setTimeout(function() { loadClients(); }, 2000);
}

async function doDocsReceived(clientId) {
  if (!confirm('Mark documents as received? The client will be notified.')) return;
  try {
    var res = await fetch('/api/lawyer/docs-received', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ client_id: clientId }) });
    var data = await res.json();
    alert(data.message || 'Updated');
    loadClients();
  } catch (e) { alert('Error'); }
}

async function doAccountOpened(clientId) {
  if (!confirm('Mark the account as opened? The client will be notified immediately!')) return;
  try {
    var res = await fetch('/api/lawyer/account-opened', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ client_id: clientId }) });
    var data = await res.json();
    alert(data.message || '🎉 Updated!');
    loadClients();
  } catch (e) { alert('Error'); }
}
</script>

</body>
</html>
