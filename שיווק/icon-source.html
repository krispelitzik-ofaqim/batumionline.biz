<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:512px;height:512px;overflow:hidden}
  .icon{
    width:512px;height:512px;position:relative;
    background:radial-gradient(120% 120% at 30% 20%, #16306a 0%, #0f2044 45%, #0a1628 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .ring{
    position:absolute;width:330px;height:330px;border-radius:50%;
    border:3px solid rgba(232,188,58,.55);
  }
  .coin{
    width:268px;height:268px;border-radius:50%;
    background:radial-gradient(120% 120% at 35% 25%, #f7dc84 0%, #e8bc3a 55%, #b8860b 100%);
    box-shadow:0 18px 50px -10px rgba(0,0,0,.55), inset 0 -10px 26px rgba(120,80,0,.45), inset 0 8px 20px rgba(255,245,200,.6);
    display:flex;align-items:center;justify-content:center;
  }
  .b{
    font-family:'Rubik',sans-serif;font-weight:900;font-size:188px;line-height:1;
    color:#5c3d05;
    text-shadow:0 2px 1px rgba(255,245,200,.5);
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="ring"></div>
    <div class="coin"><span class="b">B</span></div>
  </div>
</body>
</html>
