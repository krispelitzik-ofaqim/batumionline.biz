<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800;900&family=Assistant:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{ --navy:#0a1628; --navy-mid:#0f2044; --navy-light:#162a52; --gold:#e8bc3a; --gold-light:#f7dc84; --gold-pale:#fbefc2; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px}
  body{ font-family:'Assistant',sans-serif; color:#f4efe3; position:relative; overflow:hidden;
    background:
      radial-gradient(80% 55% at 78% 6%, rgba(61,110,196,.30), transparent 60%),
      radial-gradient(70% 50% at 14% 22%, rgba(232,188,58,.20), transparent 60%),
      linear-gradient(155deg, var(--navy) 0%, var(--navy-mid) 60%, var(--navy-light) 100%);
  }
  .frame{position:absolute;inset:36px;border:2px solid rgba(232,188,58,.35);border-radius:40px;pointer-events:none}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:84px 78px 70px}

  .kicker{font-weight:800;font-size:27px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:30px}
  .badge-secure{display:inline-block;background:rgba(232,188,58,.14);border:1px solid rgba(232,188,58,.4);color:var(--gold-light);
    font-weight:700;font-size:24px;padding:10px 26px;border-radius:999px;margin-bottom:30px}

  .icon{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:78px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));box-shadow:0 18px 44px -12px rgba(232,188,58,.6);margin-bottom:30px}

  h1{font-family:'Rubik',sans-serif;font-weight:900;font-size:80px;line-height:1.05;letter-spacing:-.01em;color:var(--gold-light);margin-bottom:22px}
  .sub{font-size:35px;font-weight:600;line-height:1.45;color:#dfe6ef;max-width:24ch;margin-bottom:38px}

  .points{display:flex;flex-direction:column;gap:16px;margin-bottom:42px;width:100%;max-width:640px}
  .pt{display:flex;align-items:center;gap:16px;justify-content:flex-start;
    background:rgba(255,255,255,.05);border:1px solid rgba(232,188,58,.25);border-radius:18px;padding:16px 26px;font-size:30px;font-weight:600}
  .pt .ck{color:var(--gold);font-weight:900;font-size:32px;flex:0 0 auto}

  .cta{display:inline-flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#2a1f05;font-weight:900;font-size:46px;padding:24px 58px;border-radius:999px;box-shadow:0 20px 40px -12px rgba(232,188,58,.7)}
  .url{margin-top:26px;font-size:34px;font-weight:800;color:var(--gold-light);letter-spacing:.02em}
  .price{position:absolute;top:96px;left:90px;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#2a1f05;
    font-weight:900;font-size:30px;padding:14px 26px;border-radius:18px;transform:rotate(-7deg);box-shadow:0 12px 26px -8px rgba(0,0,0,.4);line-height:1.1}
  .price small{display:block;font-size:16px;font-weight:700}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <div class="kicker">Batumionline · גאורגיה</div>
    <div class="icon">🏦</div>
    <h1>חשבון בנק בגאורגיה<br/>מהכורסא שלך</h1>
    <p class="sub">פתיחת חשבון בנק בינלאומי בגאורגיה — ללא טיסה, ללא המתנות, עם ליווי אישי מלא.</p>

    <div class="points">
      <div class="pt"><span class="ck">✓</span> TBC ו-Bank of Georgia — בנקים מובילים</div>
      <div class="pt"><span class="ck">✓</span> תהליך דיגיטלי פשוט מהבית</div>
      <div class="pt"><span class="ck">✓</span> ליווי עורך דין בגאורגיה</div>
    </div>

    <div class="cta">פתח חשבון עכשיו ←</div>
    <div class="url">www.batumionline.biz</div>
  </div>
</body>
</html>
